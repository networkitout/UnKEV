# Component catalog.
#
# priors are analyst estimates (0-3 except memory_unsafe 0/1). They are the
# least evidence-backed part of the model: treat them as hypotheses, tune
# them with scripts/backtest.py, and record why when you change one.
#   memory_unsafe  C/C++ core that handles untrusted input
#   preauth        how much attacker-controlled input it parses before auth
#   install_base   how widely deployed
#   embedding      how often it ships *inside* other products / appliances
#   legacy_tail    how many EOL deployments linger in the wild
#   vendor_lag     (appliances and mgmt servers) how slowly the vendor ships
#                  fixes for bundled upstream bugs. Used only by the inherited
#                  term, never by prior_score. The values below are judgment
#                  calls, not measured.
#
# surfaces use the fixed vocabulary in app/vocab.py. Spillover flows
# between components that share a surface.
#
# embeds: dependency edges for the inherited term. "This product line bundles
# X" raises the product's *likelihood* when X breaks. This is different from
# appliances.yaml `embeds`, which says "our deployed box contains X" and
# drives *exposure*. Each edge records its evidence and whether a human has
# confirmed it against the vendor's own advisory; unconfirmed edges are
# down-weighted (scoring.yaml inherited.unconfirmed_edge_weight). Exploitation
# is never inherited along these edges.
#   embeds:
#     - component: php
#       evidence: "vendor advisory, date"
#       confirmed: false
#
# ecosystem mgmt-server: management servers that host inventory does see
# (unlike appliances), so absence from inventory is meaningful.
#
# ecosystem package: a library tracked at package level through OSV
# (config/packages.yaml). Host inventory never sees these, so absence is a
# visibility gap. No aliases on purpose: names like "ip-address" are
# ordinary prose. OSV matches by exact package name; Claude maps news by
# the catalog name it is shown.
#
# inventory.absence_means: "none" | "unknown". Default is "unknown" for
# library ecosystems (host app inventory rarely sees vendored libraries) and
# "none" otherwise. A miss on an "unknown" component is a visibility gap.
#
# Matchers:
#   aliases    case-insensitive whole-word match against intel text
#   description_match: false
#              never match this component from an NVD description, only from
#              CPE. For runtimes named in thousands of unrelated advisories
#              ("Craft CMS ... PHP", "Electron ... Node.js", a router's httpd)
#              the description fallback is >90% noise. Aliases still drive the
#              RSS prefilter, where Claude makes the call.
#   cpe        "vendor:product" pairs matched against NVD cpeMatch criteria
#   kev        [vendorProject_regex, product_regex] against CISA KEV
#   inventory  regexes applied to inventory software names / OS strings

php:
  name: PHP
  ecosystem: runtime
  priors: {memory_unsafe: 1, preauth: 3, install_base: 3, embedding: 3, legacy_tail: 3}
  surfaces: [http-parsing, multipart-upload, session-state, serialization, archive, image-codec]
  aliases: ["PHP", "php-fpm", "mod_php", "php-cgi", "PHP2Shell"]
  description_match: false
  cpe: ["php:php"]
  kev: [["^php$", "php"]]
  inventory: {software: ["^php(-fpm|-cli|-common)?\\d*([ .-]|$)"]}

