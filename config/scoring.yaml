# Deterministic scoring model. Claude never writes these values.
# Tune with scripts/backtest.py; commit changes so scores stay reproducible.
version: 1

# Likelihood = weighted sum of five terms, scaled to 0-100.
weights:
  prior: 0.20       # structural risk of the component (components.yaml priors)
  activity: 0.25    # recent CVEs / emergency releases on the component itself
  spillover: 0.15   # same attack surface just broke somewhere else (variant analysis)
  exploit: 0.25     # KEV, confirmed or attempted exploitation, EPSS
  inherited: 0.15   # a component this product bundles (components.yaml embeds) just broke

half_life_days:
  activity: 21
  spillover: 30
  exploit: 45
  inherited: 45          # vendor fixes for bundled components lag; decay slower than activity

# Inherited risk along catalog `embeds` edges. Exploitation is never inherited.
inherited:
  unconfirmed_edge_weight: 0.6   # edge not yet checked against the vendor's own advisory
  lag_factor_min: 0.5            # lag_factor = min + (1 - min) * vendor_lag / 3

# Activity is baseline-relative: it reacts to a change in a component's CVE
# rate, not the level, so chronic churn (ImageMagick, libxml2) stops pinning
# the top. expected = baseline mass * recent_window / (baseline_window - recent_window),
# decayed by the window's mean decay so it sits on the same footing as the
# scored recent mass; activity = saturate(max(0, recent - beta * expected) + bonuses).
# beta 1.0 therefore cancels exactly the usual rate. Bonuses are never
# baseline-subtracted: an emergency release is anomalous by definition.
activity_baseline:
  recent_window_days: 30
  baseline_window_days: 180      # baseline = signals aged recent_window..baseline_window
  beta: 1.0                      # how much of the expected mass to subtract
  min_history_days: 150          # below this, beta is forced to 0 (cold start)

# Per-signal bonuses added to activity before saturation.
bonuses:
  emergency_release: 0.5
  poc_public: 0.4
  embargo_broken: 0.3

# Spillover: each signal pushes this much (before decay and saturation)
# onto every *other* component that shares one of its attack surfaces.
spillover_per_signal: 0.35

# Exploitation levels (max over signals, decayed).
exploit_levels:
  confirmed: 1.0
  attempts: 0.6
  none: 0.0
  unknown: 0.0
epss_weight: 0.8   # EPSS probability * this, competes in the same max()

# Exposure (estate-specific) multiplies likelihood into priority.
exposure:
  floor: 0.35            # priority = likelihood * (floor + (1-floor) * exposure)
  unknown_default: 0.5   # no inventory evidence either way: do not treat as zero
  none_value: 0.05       # inventory says confirmed absent

# Signals older than this are ignored entirely. Must be >= activity_baseline.baseline_window_days.
max_signal_age_days: 180
