# Intel sources. Structured feeds (kev, nvd, epss) are parsed deterministically.
# RSS/Atom items are prefiltered locally, then sent to Claude for extraction.
#
# Feed URLs below verified live on 2026-10-25 with the default UNKEV_UA (all
# 200), except the CISA advisories feed (403, disabled under rss). CISA's
# edge rejects bot user agents without a contact URL; keep one when you add
# or change a URL: curl -sI <url> | head -1  should return 200.

kev:
  enabled: true
  url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
  lookback_days: 120

nvd:
  enabled: true
  url: https://services.nvd.nist.gov/rest/json/cves/2.0
  # First run backfills this many days; later runs resume from the last window.
  initial_lookback_days: 14
  # Only matched CVEs at or above this score are queued for surface tagging by Claude.
  llm_tag_min_cvss: 8.0
  # Unmatched CVEs at or above this score land in the "not in catalog" list.
  unmapped_min_cvss: 9.0

epss:
  enabled: true
  url: https://api.first.org/data/v1/epss
  batch_size: 50

osv:
  enabled: true
  url: https://api.osv.dev/v1/query      # verified 2026-10-23; TODO(verify) page_token pagination
  # Packages come from config/packages.yaml. Entries at or above this score
  # are queued for surface tagging by Claude, as with NVD. Lower than NVD's
  # 8.0 on purpose: the allowlist is small, and surface tags are what let a
  # package bug spill onto the catalog components sharing that surface.
  llm_tag_min_cvss: 7.0
  pause_seconds: 0.2                      # TODO(verify) OSV rate limits
  # OSV carries CVSS vectors, not scores. v3 vectors are scored exactly. GHSA
  # advisories since 2025 carry v4 only; for those the advisory's own
  # qualitative severity is mapped to the bottom of its CVSS band so it lands
  # in the right severity bucket. A band, not a measured score. Remove this
  # block to leave v4-only records unscored (weight 0.5, never queued).
  severity_bands: {CRITICAL: 9.0, HIGH: 7.0, MODERATE: 4.0, LOW: 1.0}

rss:
  enabled: true
  max_items_per_feed: 40
  feeds:
    - {name: BleepingComputer, url: "https://www.bleepingcomputer.com/feed/"}
    - {name: The Hacker News, url: "https://feeds.feedburner.com/TheHackersNews"}
    - {name: SecurityWeek, url: "https://www.securityweek.com/feed/"}
    - {name: Help Net Security, url: "https://www.helpnetsecurity.com/feed/"}
    - {name: Node.js vulnerability blog, url: "https://nodejs.org/en/feed/vulnerability.xml"}
    - {name: PHP news, url: "https://www.php.net/feed.atom"}
    # CISA advisories, https://www.cisa.gov/cybersecurity-advisories/all.xml:
    # returned 403 to every probe on 2026-10-25 (default curl UA, the unkev UA,
    # and with browser Accept headers). Disabled until it answers again.

# Local prefilter: an RSS item is sent to Claude only if it mentions a catalog
# alias, a CVE ID, or one of these terms. Keeps token spend proportional to signal.
prefilter_terms:
  - zero-day
  - 0-day
  - exploited
  - exploitation
  - emergency
  - out-of-band
  - remote code execution
  - RCE
  - proof of concept
  - PoC
  - embargo
